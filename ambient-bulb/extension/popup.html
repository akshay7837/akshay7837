<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { font: 14px system-ui, sans-serif; width: 240px; margin: 12px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
  #status { font-size: 12px; color: #666; margin-top: 10px; }
  button { width: 100%; padding: 8px; font-size: 14px; cursor: pointer; border-radius: 6px; border: 0; background: #c00; color: #fff; }
  button.on { background: #2a7; }
</style></head><body>
  <h1>Ambient Bulb</h1>
  <button id="toggle">Off</button>
  <label>Updates/sec <input id="fps" type="range" min="1" max="10" value="6"></label>
  <label>Smoothing <input id="smoothing" type="range" min="0" max="90" value="50"></label>
  <div id="status">Checking bridge…</div>
  <script src="popup.js"></script>
</body></html>
